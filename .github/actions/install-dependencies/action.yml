name: Install dependencies
description: Install dependencies and setup + activate conda env

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "[command]sudo apt-get update"
        sudo apt-get update

    # Explanation of these dependencies:
    # - https://github.com/ImageMagick/ImageMagick/issues/374#issuecomment-279252866
    # - aspell-en for spellchecking
    - shell: bash
      run: |
        echo "[command]sudo apt-get install -y ..."
        sudo apt-get install -y \
          librsvg2-bin \
          ghostscript \
          pkg-config \
          libgraphviz-dev \
          gsfonts \
          libfreetype6-dev \
          libfontconfig1-dev \
          aspell-en

    - shell: bash
      run: |
        # Aspell does not ship en_NZ. Accept both British suffix conventions
        # used by the docs instead of falling back to the US dictionary.
        printf 'add en_GB-ise.multi\nadd en_GB-ize.multi\n' \
          | sudo tee "$(aspell dump config dict-dir)/en_NZ.multi" > /dev/null

    - uses: conda-incubator/setup-miniconda@3b0f2504dd76ef23b6d31f291f4913fb60ab5ff3 # v2.2.0
      env:
        # Keep Conda outside the checkout so linters do not scan its packages.
        CONDA: ${{ runner.temp }}/miniforge
      with:
        channels: conda-forge
        python-version: ${{ matrix.python-version || '' }}
        miniforge-version: latest

    # use login shell for conda activation
    - shell: bash -leo pipefail {0}
      run: |
        echo "CONDA_PREFIX: ${CONDA_PREFIX}"
        conda install -y graphviz
